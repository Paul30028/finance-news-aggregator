  # 全局屏蔽词：标题命中任一屏蔽词的新闻会被直接丢弃（不入库）
  block_keywords:
    - "老虎机"
    - "博彩"

# 推送通知配置（均为可选，默认关闭）
notify:
  webhook:
    enabled: false
    # 建议通过环境变量 WEBHOOK_URL 注入，避免把地址写死在配置文件里
    url_env: "WEBHOOK_URL"
  telegram:
    enabled: false
    # Bot Token 与 Chat ID 通过环境变量注入，见 .env.example
    bot_token_env: "TELEGRAM_BOT_TOKEN"
    chat_id_env: "TELEGRAM_CHAT_ID"
  # 每轮抓取最多推送多少条，避免刷屏
  max_items_per_push: 10

# "重点信号"判定与提醒配置。信号规则本身在 app/processing/signals.py 中维护，
# 这里只控制"多强的信号才算重点"以及"是否为重点信号额外发一条独立提醒"。
signals:
  # 文章情绪分（命中信号极性之和）绝对值达到此门槛才算"重点信号"。
  # 例如同时命中"降息"(+1)和"回购"(+1)得分为2，达到默认门槛会被标记为重点信号。
  alert_threshold: 2
  # 是否在 notify.webhook / notify.telegram 已启用的前提下，为重点信号额外发送
  # 一条内容更完整的独立提醒（含关注建议与免责声明），与常规新文章推送分开。
  push_alerts: true

logging:
  level: "INFO"
  # 日志文件路径，留空则只输出到 stdout
  file: "data/app.log"
  max_bytes: 5242880
  backup_count: 3
