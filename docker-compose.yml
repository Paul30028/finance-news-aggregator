services:
  finance-news-aggregator:
    build: .
    image: finance-news-aggregator:latest
    container_name: finance-news-aggregator
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 数据库文件与日志持久化到宿主机
      - ./data:/srv/app/data
      # 配置文件挂载为可写卷，方便直接在宿主机编辑 sources.yaml / config.yaml
      - ./config:/srv/app/config
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
